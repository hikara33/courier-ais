# Шлюз: единая точка входа. Наружу открыт только он.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream core     { server core:8000; }
upstream tracking { server tracking:8000; }

server {
    listen 80;
    server_name _;

    # Внутренние интерфейсы между сервисами снаружи недоступны
    location /internal/ { return 404; }

    # Приём геопозиции — сервис «Трекинг»
    location /v1/tracking/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://tracking;
        include /etc/nginx/proxy_params_common;
    }

    # Трансляция положения курьера — WebSocket, сервис «Трекинг»
    location /ws/ {
        proxy_pass http://tracking;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params_common;
    }

    # Публичный API (клиенты, курьеры, админ, партнёры) — сервис «Ядро»
    location /v1/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://core;
        include /etc/nginx/proxy_params_common;
    }

    location = /health {
        proxy_pass http://core;
    }

    # Веб-панель администратора — статические файлы
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
